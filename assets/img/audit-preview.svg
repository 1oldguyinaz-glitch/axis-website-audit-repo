<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">Example website audit report</title><desc id="desc">Stylized preview showing a website score and prioritized recommendations.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b1c1c"/><stop offset="1" stop-color="#090a0a"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f1c678"/><stop offset="1" stop-color="#a87328"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-opacity=".45"/></filter></defs><g filter="url(#shadow)"><rect x="95" y="52" width="710" height="540" rx="24" fill="url(#g)" stroke="#6c4d25"/><rect x="135" y="95" width="630" height="60" rx="12" fill="#111313" stroke="#30291e"/><text x="170" y="134" fill="#f5f0e8" font-family="Arial" font-size="24" font-weight="700">WEBSITE GROWTH AUDIT</text><text x="650" y="133" fill="#d6a555" font-family="Arial" font-size="18">AXIS</text><circle cx="250" cy="270" r="76" fill="none" stroke="#252625" stroke-width="18"/><circle cx="250" cy="270" r="76" fill="none" stroke="url(#gold)" stroke-width="18" stroke-dasharray="360 480" transform="rotate(-90 250 270)"/><text x="222" y="282" fill="#fff" font-family="Arial" font-size="38" font-weight="700">72</text><text x="182" y="374" fill="#d9d2c5" font-family="Arial" font-size="18">Overall website score</text><g font-family="Arial"><rect x="390" y="205" width="330" height="62" rx="10" fill="#151616"/><circle cx="425" cy="236" r="13" fill="#d6a555"/><text x="453" y="230" fill="#fff" font-size="18" font-weight="700">Messaging clarity</text><text x="453" y="251" fill="#aaa49a" font-size="14">Clarify the primary promise</text><rect x="390" y="283" width="330" height="62" rx="10" fill="#151616"/><circle cx="425" cy="314" r="13" fill="#d6a555"/><text x="453" y="308" fill="#fff" font-size="18" font-weight="700">Conversion path</text><text x="453" y="329" fill="#aaa49a" font-size="14">Strengthen calls to action</text><rect x="390" y="361" width="330" height="62" rx="10" fill="#151616"/><circle cx="425" cy="392" r="13" fill="#d6a555"/><text x="453" y="386" fill="#fff" font-size="18" font-weight="700">Mobile experience</text><text x="453" y="407" fill="#aaa49a" font-size="14">Reduce friction on small screens</text><rect x="135" y="468" width="585" height="78" rx="12" fill="#0e0f0f" stroke="#2f291f"/><text x="170" y="500" fill="#d6a555" font-size="16" font-weight="700">RECOMMENDED NEXT STEP</text><text x="170" y="528" fill="#fff" font-size="21" font-weight="700">Prioritize the three changes with the largest impact.</text></g></g></svg>